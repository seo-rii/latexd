disallowed-methods = [
  # The raw RenderEventEnvelope constructors were removed in 0940368 and
  # crates/tex-render-model/tests/event_origin_policy.rs now rejects any public raw
  # constructor. These two entries stay as defense in depth so a reintroduced
  # constructor is still banned in production targets; `allow-invalid` keeps the
  # currently unresolvable paths from warning on every Clippy run.
  { path = "tex_render_model::events::RenderEventEnvelope::new", reason = "production event writes must use RenderEventEnvelope::try_from_origin", allow-invalid = true },
  { path = "tex_render_model::events::RenderEventEnvelope::with_origin", reason = "raw producer/confidence pairs are compatibility-only; production writes must use RenderEventEnvelope::try_from_origin", allow-invalid = true },
  { path = "tex_vm::Vm::restore", reason = "persisted or untrusted snapshots must use Vm::try_restore" },
]
