name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  rust:
    name: Rust Test
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Test repository policy guards
        run: >-
          python3 -m unittest
          scripts.tests.test_checkpoint_reuse_boundary
          scripts.tests.test_check_hangindent_oracle
          scripts.tests.test_check_layout_integer_parameters_oracle
          scripts.tests.test_check_mathcode_delcode_oracle
          scripts.tests.test_check_tfm_validity_oracle
          scripts.tests.test_check_tolerance_oracle
          scripts.tests.test_check_snapshot_release_contract
          scripts.tests.test_check_v3_independence
          scripts.tests.test_check_v3_snapshot_migration
          scripts.tests.test_vm_restore_boundary

      - name: Enforce bounded V3 migration scope
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PUSH_BASE: ${{ github.event.before }}
        run: |
          base="$PUSH_BASE"
          if [ "$EVENT_NAME" = "pull_request" ]; then
            base="$PR_BASE"
          fi
          if ! git cat-file -e "$base^{commit}" 2>/dev/null; then
            base="$(git rev-list --max-parents=0 HEAD)"
          fi
          python3 scripts/check_v3_independence.py \
            --base "$base" \
            --head "$GITHUB_SHA" \
            --only-if-v3-touched

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.94.0
          components: clippy
          targets: x86_64-unknown-linux-gnu

      - name: Restore Rust cache
        uses: Swatinem/rust-cache@v2

      - name: Enforce production event-origin policy
        run: cargo clippy --quiet --workspace --lib --bins --no-deps -- -A warnings -D clippy::disallowed_methods

      - name: Install Computer Modern test fonts
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y texlive-fonts-recommended
          test -n "$(kpsewhich cmr10.tfm)"
          test -n "$(kpsewhich cmr7.tfm)"
          test -n "$(kpsewhich cmr10.pfb)"

      - name: Verify TeX82 mathcode and delcode oracle
        run: >-
          python3 scripts/check_mathcode_delcode_oracle.py
          --report target/mathcode-delcode-oracle.json

      - name: Upload TeX82 mathcode and delcode oracle
        uses: actions/upload-artifact@v4
        with:
          name: mathcode-delcode-oracle
          path: target/mathcode-delcode-oracle.json

      - name: Verify TeX82 tolerance oracle
        run: >-
          python3 scripts/check_tolerance_oracle.py
          --report target/tolerance-oracle.json

      - name: Upload TeX82 tolerance oracle
        uses: actions/upload-artifact@v4
        with:
          name: tolerance-oracle
          path: target/tolerance-oracle.json

      - name: Verify TeX82 layout integer parameters oracle
        run: >-
          python3 scripts/check_layout_integer_parameters_oracle.py
          --report target/layout-integer-parameters-oracle.json

      - name: Upload TeX82 layout integer parameters oracle
        uses: actions/upload-artifact@v4
        with:
          name: layout-integer-parameters-oracle
          path: target/layout-integer-parameters-oracle.json

      - name: Verify TeX82 hangindent oracle
        run: >-
          python3 scripts/check_hangindent_oracle.py
          --report target/hangindent-oracle.json

      - name: Upload TeX82 hangindent oracle
        uses: actions/upload-artifact@v4
        with:
          name: hangindent-oracle
          path: target/hangindent-oracle.json

      - name: Verify TeX82 dimension scan-context oracle
        run: >-
          python3 scripts/check_dimension_scan_context_oracle.py
          --report target/dimension-scan-context-oracle.json

      - name: Upload TeX82 dimension scan-context oracle
        uses: actions/upload-artifact@v4
        with:
          name: dimension-scan-context-oracle
          path: target/dimension-scan-context-oracle.json

      - name: Verify TeX82 TFM validity oracle
        run: >-
          python3 scripts/check_tfm_validity_oracle.py
          --report target/tfm-validity-oracle.json

      - name: Upload TeX82 TFM validity oracle
        uses: actions/upload-artifact@v4
        with:
          name: tfm-validity-oracle
          path: target/tfm-validity-oracle.json

      - name: Run Rust test suite
        run: cargo test -q

      - name: Verify native snapshot release contract
        run: python3 scripts/check_snapshot_release_contract.py

      - name: Upload native snapshot release contract
        uses: actions/upload-artifact@v4
        with:
          name: snapshot-release-contract
          path: target/snapshot-release-contract.json

  web:
    name: Web Test
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.30.0

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Install web workspace dependencies
        run: pnpm -C web install --frozen-lockfile

      - name: Install Rust toolchain for viewer integration test
        uses: dtolnay/rust-toolchain@stable

      - name: Restore viewer integration Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: viewer-e2e

      - name: Install WebAssembly target
        run: rustup target add wasm32-unknown-unknown wasm32-wasip1

      - name: Install wasm-pack
        uses: jetli/wasm-pack-action@v0.4.0
        with:
          version: v0.14.0

      - name: Install Playwright Chromium
        run: pnpm -C web --filter @latexd/viewer-app exec playwright install --with-deps chromium

      - name: Run web test suite
        run: pnpm -C web test

      - name: Build web workspace
        run: pnpm -C web build

      - name: Run viewer end-to-end test
        run: pnpm -C web test:e2e

      - name: Run static WebAssembly viewer end-to-end test
        env:
          LATEXD_VIEWER_BASE_PATH: /latexd
        run: pnpm -C web test:e2e:wasm

  component-diff:
    name: External component PDF diff
    uses: seo-rii/latexd-tests/.github/workflows/_component-diff.yml@da01f502622976f5cb85e486a2e38e897ba15419
    with:
      latexd_ref: ${{ github.sha }}
      suite_ref: da01f502622976f5cb85e486a2e38e897ba15419
      tier: smoke
    permissions:
      contents: read

  licensed-corpus:
    name: External licensed corpus
    if: github.event_name == 'push'
    uses: seo-rii/latexd-tests/.github/workflows/_test-latexd.yml@da01f502622976f5cb85e486a2e38e897ba15419
    with:
      latexd_ref: ${{ github.sha }}
      suite_ref: da01f502622976f5cb85e486a2e38e897ba15419
      tier: smoke
    permissions:
      contents: read

  renderer-benchmark:
    name: External renderer benchmark
    if: github.event_name == 'push'
    uses: seo-rii/latexd-tests/.github/workflows/_benchmark-latexd.yml@da01f502622976f5cb85e486a2e38e897ba15419
    with:
      latexd_ref: ${{ github.sha }}
      suite_ref: da01f502622976f5cb85e486a2e38e897ba15419
      iterations: 3
    permissions:
      contents: read
